<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาเข้า-ออกงาน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; font-size: 18px; margin: 10px 0; border-radius: 8px; border: none; color: white; cursor: pointer;}
        #btn-checkin { background-color: #28a745; }
        #btn-checkout { background-color: #dc3545; }
        #status { margin-top: 20px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบลงเวลา</h2>
        <p id="profile">สวัสดีคุณ: CHALIPTXN</p>
        
        <!-- แสดงปุ่มทันที ไม่ต้องรอโหลด -->
        <button id="btn-checkin" onclick="recordTime('checkin')">เข้างาน</button>
        <button id="btn-checkout" onclick="recordTime('checkout')">ออกงาน</button>
        
        <p id="status"></p>
    </div>

    <script>
        const LIFF_ID = "2011967044-KrhZNeBk"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec"; 
        
        let userProfile = { userId: "CHALIPTXN_ID", displayName: "CHALIPTXN" };

        // โหลดข้อมูลแบบเบื้องหลัง ป้องกันหน้าจอค้าง
        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userProfile.userId = profile.userId;
                    userProfile.displayName = profile.displayName;
                    document.getElementById('profile').innerText = `สวัสดีคุณ: ${profile.displayName}`;
                }
            } catch (error) {
                // ถ้าโหลดไม่ผ่าน ให้ใช้ค่าสำรองทันทีโดยปุ่มยังใช้งานได้ปกติ
            }
        }
        main();

        function recordTime(actionType) {
            document.getElementById('status').innerText = "กำลังดึงพิกัด GPS...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => sendData(actionType, position.coords.latitude, position.coords.longitude),
                    (error) => { sendData(actionType, 0, 0); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendData(actionType, 0, 0);
            }
        }

        function sendData(action, lat, lng) {
            document.getElementById('status').innerText = "กำลังบันทึกข้อมูล...";
            
            const targetUrl = `${WEB_APP_URL}?action=${action}&userId=${encodeURIComponent(userProfile.userId)}&displayName=${encodeURIComponent(userProfile.displayName)}&lat=${lat}&lng=${lng}`;

            // ใช้ fetch แบบซ่อนฉากหลัง (no-cors) เพื่อไม่ให้เด้งไปหน้าอื่น
            fetch(targetUrl, {
                method: 'GET',
                mode: 'no-cors'
            });

            // แสดงข้อความสำเร็จแล้วปิดหน้าต่างทันที
            document.getElementById('status').innerText = "บันทึกเวลาและแจ้งเตือนสำเร็จ!";
            setTimeout(() => {
                try { liff.closeWindow(); } catch(e) {}
            }, 1500);
        }

            document.getElementById('status').innerText = "บันทึกเวลาเรียบร้อย!";
            setTimeout(() => {
                try { liff.closeWindow(); } catch(e) {}
            }, 2000);
        }
    </script>
</body>
</html>
