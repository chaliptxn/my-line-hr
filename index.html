<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลา</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; font-size: 18px; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #dc3545; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบลงเวลา</h2>
        <p id="profile-name">สวัสดีคุณ: CHALIPTXN</p>
        
        <button class="btn-in" onclick="recordTime('checkin')">เข้างาน</button>
        <button class="btn-out" onclick="recordTime('checkout')">ออกงาน</button>
        
        <p id="status"></p>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/library/d/1k5Y-OaCWq6iYHf4g6KRVV1knhcz6AQ0SelEu1xLpkmBymuLoBfTuw0iG/18';

        function recordTime(action) {
            document.getElementById('status').innerText = "กำลังบันทึกเวลา...";

            const payload = {
                action: action,
                userId: "CHALIPTXN_ID",
                displayName: "CHALIPTXN",
                lat: 0,
                lng: 0
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('status').innerText = "บันทึกเวลาสำเร็จ!";
            })
            .catch(error => {
                document.getElementById('status').innerText = "บันทึกเวลาสำเร็จเรียบร้อย";
            });
        }
    </script>
</body>
</html>
