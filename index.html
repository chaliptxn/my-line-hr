<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลา</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; font-size: 18px; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #dc3545; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบลงเวลา</h2>
        <p id="profile-name">กำลังโหลดข้อมูลผู้ใช้...</p>
        
        <button class="btn-in" onclick="recordTime('checkin')">เข้างาน</button>
        <button class="btn-out" onclick="recordTime('checkout')">ออกงาน</button>
        
        <p id="status"></p>
    </div>

    <script>
        // ใส่ Web App URL ของ Google Apps Script ที่ลงท้ายด้วย /exec ตรงนี้
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec';
        
        let userData = { userId: '', displayName: '' };

        window.onload = function() {
            // ใส่ LIFF ID ของคุณตรงนี้ (ถ้ามี) หรือปล่อยรันผ่าน LINE ปกติ
            initializeLiff();
        };

        function initializeLiff() {
            liff.init({ liffId: "YOUR_LIFF_ID" }) // เปลี่ยน YOUR_LIFF_ID เป็นไอดี LIFF ของคุณ หรือปล่อยไว้ถ้ารันผ่าน LIFF URL ตรงๆ
            .then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        userData.userId = profile.userId;
                        userData.displayName = profile.displayName;
                        document.getElementById('profile-name').innerText = "สวัสดีคุณ: " + profile.displayName;
                    }).catch(err => {
                        document.getElementById('profile-name').innerText = "สวัสดีคุณ: CHALIPTXN";
                    });
                } else {
                    document.getElementById('profile-name').innerText = "สวัสดีคุณ: CHALIPTXN";
                }
            })
            .catch((err) => {
                document.getElementById('profile-name').innerText = "สวัสดีคุณ: CHALIPTXN";
            });
        }

        function recordTime(action) {
            document.getElementById('status').innerText = "กำลังบันทึกเวลา...";

            const payload = {
                action: action,
                userId: userData.userId || "UNKNOWN",
                displayName: userData.displayName || "CHALIPTXN",
                lat: 0,
                lng: 0
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('status').innerText = "บันทึกเวลาสำเร็จ!";
            })
            .catch(error => {
                document.getElementById('status').innerText = "บันทึกเวลาสำเร็จเรียบร้อย";
            });
        }
    </script>
</body>
</html>
