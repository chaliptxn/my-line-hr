<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <!-- โหลดฟอนต์ Kanit จาก Google Fonts ให้สวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f0f4f8; /* สีพื้นหลังสว่าง สบายตา */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            padding: 30px 20px;
            text-align: center;
        }
        .header-title {
            color: #1e293b;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            margin-top: 0;
        }
        .clock-container {
            background: #f8fbff;
            border: 1px solid #e1eeff;
            border-radius: 15px;
            padding: 15px 10px;
            margin: 20px 0;
        }
        #clock {
            font-size: 48px;
            font-weight: 600;
            color: #2563eb;
            line-height: 1;
            margin-bottom: 5px;
        }
        #date {
            font-size: 15px;
            color: #64748b;
            font-weight: 400;
        }
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        #profile-image {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #f1f5f9;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            display: none; /* ซ่อนไว้ก่อนโหลดรูปเสร็จ */
        }
        #user-name {
            font-size: 16px;
            color: #334155;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-family: 'Kanit', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.97); /* เอฟเฟกต์ตอนกดปุ่ม */
        }
        .btn-in {
            background: #10b981; /* สีเขียวทันสมัย */
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-out {
            background: #ef4444; /* สีแดงทันสมัย */
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        #status-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #64748b;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="header-title">ระบบลงเวลาทำงาน</h2>
        
        <!-- กล่องแสดงเวลาแบบเรียลไทม์ -->
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">กำลังโหลดวันที่...</div>
        </div>

        <!-- กล่องแสดงโปรไฟล์ LINE -->
        <div class="profile-section">
            <img id="profile-image" src="" alt="Profile">
            <div id="user-name">สวัสดี, กำลังโหลดข้อมูล...</div>
        </div>

        <!-- ปุ่มเข้างาน / ออกงาน -->
        <button class="btn btn-in" id="btnCheckin" onclick="handleAction('checkin', this)">
            <span class="btn-text">📍 เข้างาน</span>
            <div class="spinner"></div>
        </button>
        <button class="btn btn-out" id="btnCheckout" onclick="handleAction('checkout', this)">
            <span class="btn-text">🏠 ออกงาน</span>
            <div class="spinner"></div>
        </button>

        <div id="status-msg"></div>
    </div>

    <script>
        // กำหนดตั้งค่า (ใช้ LIFF ID และ Web App URL ของคุณ)
        const LIFF_ID = "2011967044-KrhZNeBk"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec"; 
        let userProfile = { userId: "CHALIPTXN_ID", displayName: "พนักงาน" };

        // ทำให้นาฬิกาเดิน และแสดงวันที่ภาษาไทย
        function updateTime() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hh}:${mm}:${ss}`;

            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('date').innerText = `วัน${days[now.getDay()]}ที่ ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear() + 543}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // โหลดข้อมูล LINE Profile
        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userProfile.userId = profile.userId;
                    userProfile.displayName = profile.displayName;
                    document.getElementById('user-name').innerText = `สวัสดีคุณ: ${profile.displayName}`;
                    
                    // แสดงรูปโปรไฟล์ LINE
                    if(profile.pictureUrl) {
                        const img = document.getElementById('profile-image');
                        img.src = profile.pictureUrl;
                        img.style.display = 'block';
                    }
                }
            } catch(e) {
                document.getElementById('user-name').innerText = "สวัสดีคุณ: CHALIPTXN";
            }
        }
        initLiff();

        // เมื่อกดปุ่มเข้างาน/ออกงาน
        function handleAction(action, btn) {
            // ซ่อนไอคอน และแสดงวงกลมหมุนๆ (Loading)
            const textSpan = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            textSpan.style.display = 'none';
            spinner.style.display = 'block';
            document.getElementById('status-msg').innerText = "กำลังดึงพิกัด GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendData(action, pos.coords.latitude, pos.coords.longitude),
                    (err) => sendData(action, 0, 0),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendData(action, 0, 0);
            }
        }

        // ส่งข้อมูลไปยัง Google Apps Script
        function sendData(action, lat, lng) {
            document.getElementById('status-msg').innerHTML = "<span style='color:#10b981'>กำลังส่งข้อมูล...</span>";
            const url = `${WEB_APP_URL}?action=${action}&userId=${encodeURIComponent(userProfile.userId)}&displayName=${encodeURIComponent(userProfile.displayName)}&lat=${lat}&lng=${lng}`;
            window.location.replace(url);
        }
    </script>
</body>
</html>
