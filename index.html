<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <!-- โหลดฟอนต์ Sarabun (สารบรรณ) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); padding: 30px 20px; text-align: center; }
        .header-title { color: #1e293b; font-size: 28px; font-weight: 700; margin-bottom: 5px; margin-top: 0; }
        .clock-container { background: #f8fbff; border: 1px solid #e1eeff; border-radius: 15px; padding: 15px 10px; margin: 20px 0; }
        #clock { font-size: 55px; font-weight: 700; color: #2563eb; line-height: 1; margin-bottom: 5px; }
        #date { font-size: 18px; color: #64748b; font-weight: 500; }
        .profile-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        #profile-image { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background-color: #f1f5f9; border: 3px solid #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 12px; display: none; }
        #user-name { font-size: 20px; color: #334155; font-weight: 600; }
        .btn { width: 100%; padding: 18px; font-size: 22px; font-family: 'Sarabun', sans-serif; font-weight: 600; border: none; border-radius: 12px; color: white; cursor: pointer; margin-bottom: 15px; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-in { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-out { background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        #status-msg { margin-top: 10px; font-size: 16px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <h2 class="header-title">ระบบลงเวลาทำงาน</h2>
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">กำลังโหลดวันที่...</div>
        </div>
        <div class="profile-section">
            <img id="profile-image" src="" alt="Profile">
            <div id="user-name">สวัสดี, กำลังโหลดข้อมูล...</div>
        </div>
        <button class="btn btn-in" id="btnCheckin" onclick="handleAction('checkin', this)">📍 เข้างาน</button>
        <button class="btn btn-out" id="btnCheckout" onclick="handleAction('checkout', this)">🏠 ออกงาน</button>
        <div id="status-msg"></div>
    </div>

    <script>
        const LIFF_ID = "2011967044-KrhZNeBk"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec"; 
        let userProfile = { userId: "CHALIPTXN_ID", displayName: "พนักงาน" };

        function updateTime() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hh}:${mm}:${ss}`;

            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('date').innerText = `วัน${days[now.getDay()]}ที่ ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear() + 543}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userProfile.userId = profile.userId;
                    userProfile.displayName = profile.displayName;
                    document.getElementById('user-name').innerText = `สวัสดีคุณ: ${profile.displayName}`;
                    if(profile.pictureUrl) {
                        const img = document.getElementById('profile-image');
                        img.src = profile.pictureUrl;
                        img.style.display = 'block';
                    }
                }
            } catch(e) {
                document.getElementById('user-name').innerText = "สวัสดีคุณ: CHALIPTXN";
            }
        }
        initLiff();

        function handleAction(action, btn) {
            btn.style.opacity = '0.7';
            btn.innerText = 'กำลังโหลด...';
            document.getElementById('status-msg').innerHTML = "<span style='color:#10b981'>กำลังส่งข้อมูล...</span>";
            
            // ส่งข้อมูลโดยตรง ไม่ต้องขอ GPS (ส่งค่า lat, lng เป็น 0)
            const url = `${WEB_APP_URL}?action=${action}&userId=${encodeURIComponent(userProfile.userId)}&displayName=${encodeURIComponent(userProfile.displayName)}&lat=0&lng=0`;
            window.location.href = url; // ใช้ href เปลี่ยนหน้า เพื่อให้หน้าจอแสดงผลได้ถูกต้อง
        }
    </script>
</body>
</html>
