<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <!-- โหลดฟอนต์ Sarabun (สารบรรณ) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            padding: 30px 20px;
            text-align: center;
        }
        .header-title {
            color: #1e293b;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            margin-top: 0;
        }
        .clock-container {
            background: #f8fbff;
            border: 1px solid #e1eeff;
            border-radius: 15px;
            padding: 15px 10px;
            margin: 20px 0;
        }
        #clock {
            font-size: 55px; /* นาฬิกาขนาดใหญ่ */
            font-weight: 700;
            color: #2563eb;
            line-height: 1;
            margin-bottom: 5px;
        }
        #date {
            font-size: 18px;
            color: #64748b;
            font-weight: 500;
        }
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        #profile-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #f1f5f9;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            display: none; 
        }
        #user-name {
            font-size: 20px;
            color: #334155;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:active {
            transform: scale(0.97); 
        }
        .btn-in {
            background: #10b981; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .btn-out {
            background: #ef4444; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .spinner {
            border: 4px solid rgba(37, 99, 235, 0.2);
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* สไตล์สำหรับตอนกำลังโหลดและตอนแสดงผลลัพธ์ */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <h2 class="header-title">ระบบลงเวลาทำงาน</h2>
        
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">กำลังโหลดวันที่...</div>
        </div>

        <div class="profile-section">
            <img id="profile-image" src="" alt="Profile">
            <div id="user-name">สวัสดี, กำลังโหลดข้อมูล...</div>
        </div>

        <button class="btn btn-in" id="btnCheckin" onclick="handleAction('checkin')">📍 เข้างาน</button>
        <button class="btn btn-out" id="btnCheckout" onclick="handleAction('checkout')">🏠 ออกงาน</button>
    </div>

    <script>
        const LIFF_ID = "2011967044-KrhZNeBk"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec"; 
        let userProfile = { userId: "CHALIPTXN_ID", displayName: "พนักงาน" };

        function updateTime() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hh}:${mm}:${ss}`;

            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('date').innerText = `วัน${days[now.getDay()]}ที่ ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear() + 543}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userProfile.userId = profile.userId;
                    userProfile.displayName = profile.displayName;
                    document.getElementById('user-name').innerText = `สวัสดีคุณ: ${profile.displayName}`;
                    
                    if(profile.pictureUrl) {
                        const img = document.getElementById('profile-image');
                        img.src = profile.pictureUrl;
                        img.style.display = 'block';
                    }
                }
            } catch(e) {
                document.getElementById('user-name').innerText = "สวัสดีคุณ: CHALIPTXN";
            }
        }
        initLiff();

        function handleAction(action) {
            const card = document.getElementById('main-card');
            
            // เปลี่ยนหน้าตาเป็นการโหลดเบื้องหลัง (ฟอนต์ใหญ่)
            card.innerHTML = `
                <div style="padding: 40px 10px;">
                    <h2 style="color: #2563eb; font-size: 32px; font-weight: 700;">กำลังประมวลผล...</h2>
                    <div class="spinner"></div>
                    <p style="color: #64748b; font-size: 22px; margin-top: 25px;">ระบบกำลังบันทึกข้อมูลและดึงพิกัด GPS<br>กรุณารอสักครู่</p>
                </div>
            `;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendData(action, pos.coords.latitude, pos.coords.longitude, card),
                    (err) => sendData(action, 0, 0, card),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendData(action, 0, 0, card);
            }
        }

        function sendData(action, lat, lng, cardElement) {
            const url = `${WEB_APP_URL}?action=${action}&userId=${encodeURIComponent(userProfile.userId)}&displayName=${encodeURIComponent(userProfile.displayName)}&lat=${lat}&lng=${lng}`;
            
            fetch(url)
            .then(response => response.json())
            .then(data => {
                const titleColor = data.isError ? "#ef4444" : "#10b981";
                
                // แสดงหน้าผลลัพธ์ (แบบเดียวกับที่เห็นในรูปที่ 10 แต่ฟอนต์ใหญ่มาก)
                cardElement.innerHTML = `
                    <div style="padding: 30px 10px;">
                        <h2 style="color: ${titleColor}; font-size: 38px; font-weight: 700; margin-top: 0; margin-bottom: 25px;">${data.title}</h2>
                        <div style="font-size: 28px; color: #334155; font-weight: 500; line-height: 1.5; margin-bottom: 40px;">
                            ${data.message}
                        </div>
                        <div style="font-size: 22px; color: #94a3b8; font-weight: 600; animation: pulse 1.5s infinite;">
                            กำลังกลับสู่หน้าแชท LINE...
                        </div>
                    </div>
                `;
                
                // สั่งปิดหน้าต่างให้เด้งกลับแชทอัตโนมัติ (จะทำงานได้สำเร็จ 100% เพราะไม่ได้เปลี่ยนหน้าเว็บ)
                setTimeout(() => {
                    liff.closeWindow();
                }, data.isError ? 3500 : 2500);
            })
            .catch(error => {
                cardElement.innerHTML = `
                    <div style="padding: 30px 10px;">
                        <h2 style="color: #ef4444; font-size: 34px;">❌ เกิดข้อผิดพลาด</h2>
                        <p style="font-size: 24px; color: #64748b;">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</p>
                        <div style="font-size: 22px; color: #94a3b8; font-weight: 600; animation: pulse 1.5s infinite; margin-top: 30px;">
                            กำลังกลับสู่หน้าแชท LINE...
                        </div>
                    </div>
                `;
                setTimeout(() => { liff.closeWindow(); }, 3000);
            });
        }
    </script>
</body>
</html>
