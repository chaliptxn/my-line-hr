<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาเข้า-ออกงาน</title>
    <!-- นำเข้า LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 15px; font-size: 18px; margin: 10px 0; border-radius: 8px; border: none; color: white; cursor: pointer;}
        #btn-checkin { background-color: #28a745; }
        #btn-checkout { background-color: #dc3545; }
        #status { margin-top: 20px; color: #555; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ระบบลงเวลา</h2>
        <p id="profile">กำลังโหลดข้อมูลผู้ใช้...</p>
        
        <!-- ปุ่มสำหรับกดเข้าออก -->
        <button id="btn-checkin" onclick="recordTime('checkin')" style="display:none;">เข้างาน</button>
        <button id="btn-checkout" onclick="recordTime('checkout')" style="display:none;">ออกงาน</button>
        
        <p id="status"></p>
    </div>

    <script>
        const LIFF_ID = "2011967044-KrhZNeBk"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsMv63TBxzew-TjDcMaxLasNrS8Dk4fdSjaV_UOLpsOiwmFPNseYwiIakbCQppLP9X/exec"; 
        
        let userProfile = null;

        // เริ่มต้นการทำงานของ LIFF (มีฟังก์ชัน main เพียงชุดเดียวเท่านั้น)
        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    userProfile = await liff.getProfile();
                    
                    // แสดงชื่อและ User ID เพื่อเช็คความถูกต้อง
                    document.getElementById('profile').innerText = `สวัสดีคุณ: ${userProfile.displayName}`;
                    
                    document.getElementById('btn-checkin').style.display = "block";
                    document.getElementById('btn-checkout').style.display = "block";
                } else {
                    liff.login();
                }
            } catch (error) {
                document.getElementById('profile').innerText = "เกิดข้อผิดพลาดในการโหลด LIFF";
            }
        }
        
        // เรียกใช้งานฟังก์ชันหลักทันที
        main();

        // ฟังก์ชันเมื่อกดปุ่มเข้าหรือออกงาน
        function recordTime(actionType) {
            document.getElementById('status').innerText = "กำลังดึงพิกัด GPS...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => sendData(actionType, position.coords.latitude, position.coords.longitude),
                    (error) => { 
                        sendData(actionType, 0, 0); 
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendData(actionType, 0, 0);
            }
        }

        // ส่งข้อมูลไปที่ Google Apps Script
        function sendData(action, lat, lng) {
            document.getElementById('status').innerText = "กำลังบันทึกข้อมูล...";
            
            const payload = {
                action: action,
                userId: userProfile ? userProfile.userId : "UNKNOWN",
                displayName: userProfile ? userProfile.displayName : "CHALIPTXN",
                lat: lat,
                lng: lng
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('status').innerText = "บันทึกเวลาเรียบร้อย!";
                setTimeout(() => {
                    try { liff.closeWindow(); } catch(e) {}
                }, 2000);
            })
            .catch(error => {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
            });
        }
    </script>
</body>
</html>
